<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo-core placeholder</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #14213d;
        --muted: #4a5568;
        --bg: #f7f3ea;
        --accent: #0f6b5c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, #e7f0ea, transparent 40%),
          radial-gradient(circle at 80% 0%, #f0e6d8, transparent 35%),
          var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0.5rem 0;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>demo-core placeholder</h1>
      <p>
        Local bank-proxy surface for the computer-use automation system.
        Full multi-step hostile UI (search → detail → action, injectable errors)
        lands in <code>PLAN.md</code> Phase 11.
      </p>
      <p>Health check: <code>GET /health</code></p>
    </main>
  </body>
</html>
